{% extends "base.html" %}

{% block title %}400 Bad Request — SmartSpend{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 220px); display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem 1rem;">
  <div style="max-width: 480px;">
    <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">⚠️</div>
    <h1 style="font-size: 2rem; font-weight: 800; color: var(--brand-navy); margin-bottom: 0.75rem;">{{ error_title or "400 Bad Request" }}</h1>
    <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 1.5rem;">
      {{ error_message or "The request could not be processed due to invalid or expired security tokens." }}
    </p>
    <a href="{{ url_for('dashboard.index') if current_user else url_for('auth.login') }}" class="btn btn-primary">
      Return to Safety
    </a>
  </div>
</div>
{% endblock %}
