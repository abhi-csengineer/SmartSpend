{% extends "base.html" %}

{% block title %}500 Server Error — SmartSpend{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 220px); display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem 1rem;">
  <div style="max-width: 480px;">
    <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">⚡</div>
    <h1 style="font-size: 2rem; font-weight: 800; color: var(--brand-navy); margin-bottom: 0.75rem;">Internal Server Error</h1>
    <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 1.5rem;">
      Something went wrong on our end. Please try refreshing or return to the dashboard.
    </p>
    <a href="{{ url_for('dashboard.index') if current_user else url_for('auth.login') }}" class="btn btn-primary">
      Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}
